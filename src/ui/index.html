<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SolRadar Helper</title>
<style>
  :root {
    --bg: #f4f5f8; --panel: #ffffff; --raise: #eceef3; --line: #dcdfe6; --fg: #1d2330; --muted: #5d6675; --dim: #a3aab8;
    --accent: #4b54d6; --accent-text: #ffffff; --ok: #1f8a4c; --warn: #b26a00; --err: #c62828; --cyan: #0e6c8f;
    --log-bg: #fafbfc; --time: #8a93a3; --err-bg: rgba(198,40,40,.07); --err-line: rgba(198,40,40,.4); --shadow: 0 10px 26px rgba(20,25,40,.18);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c; --panel: #1c1f26; --raise: #242832; --line: #2d323d; --fg: #e6e8ee; --muted: #8b93a3; --dim: #4a5060;
      --accent: #7c86ff; --accent-text: #0e1030; --ok: #4cc38a; --warn: #f0b429; --err: #f06a6a; --cyan: #5cc8e6;
      --log-bg: #0f1114; --time: #5b6272; --err-bg: rgba(240,106,106,.08); --err-line: rgba(240,106,106,.45); --shadow: 0 12px 28px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; }
  main { height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 10px; min-height: 0; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--raise); color: var(--fg); padding: 6px 12px; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 4px 8px; }
  button.ghost:hover:not(:disabled) { color: var(--fg); background: var(--raise); }
  button.menubtn { font-size: 16px; line-height: 1; padding: 4px 9px; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); }
  button.link:hover:not(:disabled) { text-decoration: underline; }
  .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: currentColor; }
  .dot.run { color: var(--accent); } .dot.muted { color: var(--dim); }
  .title { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { flex: none; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--warn); color: var(--warn); }
  .notice { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 5px 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }
  .headwrap { position: relative; }
  .fatal { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--err-line); background: var(--err-bg); color: var(--err); border-radius: 6px; }
  .bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; flex: none; }
  .bar::after { content: ""; display: block; width: 35%; height: 100%; background: var(--accent); animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .5; } }

  .strip { display: grid; gap: 4px; flex: none; }
  .f-seg { display: grid; gap: 4px; font-size: 11px; color: var(--muted); min-width: 0; }
  .f-seg i { height: 4px; border-radius: 2px; background: var(--line); }
  .f-seg.ok i { background: var(--ok); } .f-seg.warn i { background: var(--warn); } .f-seg.err i { background: var(--err); }
  .f-seg.skip i { background: var(--dim); opacity: .6; }
  .f-seg.run i { background: linear-gradient(90deg, var(--accent) 50%, var(--line) 50%); }
  .ico { flex: none; display: block; }
  .f-seg .nm { display: flex; align-items: center; gap: 5px; }
  .f-seg span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-seg b { color: var(--fg); font-weight: 500; }
  .f-seg .warn { color: var(--warn); } .f-seg .err { color: var(--err); }

  .selfsteps { flex: none; }
  .selfsteps ol { margin: 6px 0 6px; padding-left: 20px; }
  .selfsteps .acts { display: flex; gap: 8px; }

  .tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 11.5px; color: var(--muted); flex: none; }
  .tools .sws { display: flex; gap: 14px; }
  .sw { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--muted); font-size: 11.5px; }
  .sw i { width: 24px; height: 13px; border-radius: 7px; background: var(--line); position: relative; }
  .sw i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); transition: left .12s; }
  .sw.on i { background: var(--accent); } .sw.on i::after { left: 13px; background: #fff; }

  .fl { flex: 1; min-height: 0; overflow: auto; background: var(--log-bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 0; font-size: 12.5px; }
  .fl .empty { padding: 3px 10px; color: var(--muted); }
  .fl-g { padding: 3px 10px; }
  .fl-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .fl-h .t { font: 11px "Cascadia Mono", Consolas, monospace; color: var(--time); flex: none; }
  .fl-h .ic { width: 12px; text-align: center; flex: none; font-weight: 700; }
  .fl-h .x { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fl-h .x.bold { font-weight: 600; }
  .fl-h .n { font-size: 11px; color: var(--muted); flex: none; background: none; border: 0; padding: 0; }
  .fl-h .n:hover { color: var(--fg); }
  .fl-cmd { margin: 3px 0 2px 58px; font: 11px/1.55 "Cascadia Mono", Consolas, monospace; color: var(--muted); border-left: 1px solid var(--line); padding-left: 8px; }
  .fl-cmd p { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .fl-cmd .c { color: var(--cyan); }
  .errbox { margin: 4px 10px; padding: 8px 10px; border: 1px solid var(--err-line); background: var(--err-bg); border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .errbox b { color: var(--err); }

  footer { flex: none; font-size: 11px; color: var(--muted); }

  .menu { position: absolute; right: 0; top: calc(100% + 4px); width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: var(--shadow); z-index: 5; font-size: 12.5px; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  .menu .note { padding: 4px 10px; font-size: 11px; color: var(--muted); }
  .mi { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 6px 10px; color: var(--fg); }
  .mi:hover:not(:disabled), .mi:focus-visible { background: var(--raise); outline: none; }
  .mi.danger { color: var(--err); }
  .mi .mt { display: grid; min-width: 0; }
  .mi small { color: var(--muted); font-size: 11px; white-space: normal; }
  .mi .r { flex: none; color: var(--muted); }
  .mi .r.on { color: var(--accent); font-weight: 700; }
  .has-sub > .sub { display: none; position: absolute; right: calc(100% - 2px); top: -1px; width: 250px; max-height: calc(100vh - 60px); overflow: auto; }
  .has-sub:hover > .sub, .has-sub.open > .sub, .has-sub:focus-within > .sub { display: block; }
  .menu:not(.sub):hover .has-sub.open:not(:hover):not(:focus-within) > .sub { display: none; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .overlay .dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--fg); max-width: 460px; width: 100%; padding: 14px 16px; box-shadow: var(--shadow); }
  .overlay .dialog p { margin: 0 0 8px; white-space: pre-wrap; }
  .overlay .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 11; }
</style>
</head>

<script>
"use strict";
// Forward UI errors to the backend log, so problems inside the window are never silent.
// Loop-proof: binding-parse errors are ignored, errors raised while forwarding are never forwarded,
// and at most 5 errors per 10 s are forwarded.
let forwarding = false;
const forwardTimes = [];
function reportError(err) {
  const message = err && err.message ? String(err.message) : String(err);
  const stack = err && err.stack ? String(err.stack) : undefined;
  if (message.includes("Failed to parse binding result as JSON")) return;
  if (forwarding) return;
  const now = Date.now();
  while (forwardTimes.length && now - forwardTimes[0] > 10000) forwardTimes.shift();
  if (forwardTimes.length >= 5) return;
  forwardTimes.push(now);
  forwarding = true;
  try {
    const p = window.__send({ type: "ui-error", message, stack });
    if (p && typeof p.catch === "function") p.catch(() => {});
  } catch (_) { /* nothing else we can do */ }
  finally { forwarding = false; }
  try {
    ui.fatal = "Something went wrong in the window. Open the logs for details.";
    render();
  } catch (_) { /* rendering itself is broken */ }
}
window.onerror = (message, source, line, col, error) => {
  reportError(error || new Error(`${message} (${source}:${line}:${col})`));
};
window.addEventListener("unhandledrejection", ev => reportError(ev.reason));

const VENCORD_INSTALLER_URL = "https://vencord.dev/download/";
const DISCORD_DOWNLOAD_URL = "https://discord.com/download";
const HELP_URL = "https://github.com/masutty/solradar-helper#readme";

const ui = {
  view: null, busy: false, op: null, steps: [], cancellable: true, result: null, starting: false,
  deps: {}, showManual: false, redact: true, fatal: null,
  logs: [], seq: 0, showCommands: false, showBackground: false, groupOpen: {}, logStick: true, logTop: 0,
  menu: false, menuSub: null, focusId: null,
};
const send = cmd => {
  const p = window.__send(cmd);
  if (p && typeof p.catch === "function") p.catch(() => {});
  return p;
};

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) node.addEventListener(k.slice(2), ev => {
      try {
        const r = v(ev);
        if (r && typeof r.then === "function") r.then(undefined, reportError);
      } catch (err) { reportError(err); }
    });
    else if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}

const SVG_NS = "http://www.w3.org/2000/svg";
function icon(key, size) {
  const markup = ICONS[key];
  if (!markup) return null;
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", String(size));
  svg.setAttribute("height", String(size));
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("class", "ico");
  svg.innerHTML = markup;
  return svg;
}

function confirmDialog(text) {
  return new Promise(resolve => {
    const done = answer => { overlay.remove(); resolve(answer); };
    const overlay = el("div", { class: "overlay" },
      el("div", { class: "dialog", role: "dialog" },
        el("p", { text }),
        el("div", { class: "actions" },
          el("button", { onclick: () => done(false), text: "Cancel" }),
          el("button", { class: "primary", onclick: () => done(true), text: "Continue" }))));
    document.body.append(overlay);
  });
}

// Show the progress state right away; the backend's "steps" event replaces this placeholder.
function runOp(op, closeDiscord) {
  ui.result = null; ui.op = op; ui.steps = []; ui.cancellable = true; ui.starting = true; ui.menu = false; ui.menuSub = null;
  ui.logStick = true;
  render();
  send({ type: "run", op, closeDiscord });
}

function toast(text) {
  const t = el("div", { class: "toast", text });
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

async function startOperation(op) {
  const v = ui.view;
  const needsClose = v.discord.running && (op === "install" || op === "uninstall" || op === "inject" || (op === "update" && !v.discord.injected));
  const lines = [];
  if (op === "update" && v.updateLabel === "Reinstall") lines.push("Your system already looks up to date. Do you want to reinstall anyway?");
  if (op === "uninstall") lines.push("This removes Vencord from Discord completely — not only SolRadar. If you want regular Vencord back afterwards, use the official Vencord Installer.");
  if (op === "repair") lines.push("The Helper's copy of Vencord or SolRadar has unexpected changes. Repair discards those changes and restores the original files.");
  if (needsClose) lines.push("Discord needs to be closed and will be closed now.");
  if (op === "update" && v.discord.running && !needsClose) lines.push("Discord will restart when the update is done.");
  if (op === "inject" && !needsClose) lines.push("SolRadar will be applied to Discord again.");
  if (lines.length && !(await confirmDialog(lines.join("\n\n")))) return;
  runOp(op, needsClose);
}

function handle(e) {
  switch (e.type) {
    case "view": ui.view = e.view; ui.busy = e.busy; break;
    case "steps": ui.op = e.op; ui.steps = e.steps; ui.result = null; ui.starting = false; ui.cancellable = true; break;
    case "step": {
      const s = ui.steps.find(x => x.id === e.id);
      if (s) { s.status = e.status; s.detail = e.detail; }
      ui.cancellable = e.cancellable;
      break;
    }
    case "output": break; // the same lines arrive as log entries
    case "operation-end": ui.result = e; ui.op = e.op; ui.starting = false; break;
    case "log":
      e.entry._id = ++ui.seq;
      ui.logs.push(e.entry);
      if (ui.logs.length > 500) ui.logs.splice(0, ui.logs.length - 500);
      break;
    case "dependency-install":
      ui.deps[e.id] = e;
      if (e.status === "done") toast("Installed successfully.");
      break;
    case "show-activity": ui.logStick = true; break;
    case "report-ready": toast("Debug report saved. Explorer will show the file."); break;
    case "fatal": ui.fatal = e.message; break;
  }
}

function back() {
  ui.op = null; ui.result = null; ui.steps = []; ui.starting = false;
  send({ type: "refresh" });
  render();
}

// ---- header model ----------------------------------------------------------------------------
const VERB = { install: "Installing SolRadar", update: "Updating SolRadar", uninstall: "Removing Vencord", repair: "Repairing", build: "Rebuilding SolRadar", inject: "Re-applying to Discord" };
const FAILED = { install: "Install failed", update: "Update failed", uninstall: "Uninstall failed", repair: "Repair failed", build: "Rebuild failed", inject: "Re-apply failed" };
const SUCCESS = {
  install: "SolRadar installed", update: "SolRadar updated", uninstall: "Vencord removed from Discord",
  repair: "Repair complete", build: "SolRadar rebuilt", inject: "SolRadar re-applied to Discord",
};

function isCancelled() { return !!ui.result && !ui.result.ok && ui.result.error && ui.result.error.kind === "cancelled"; }

// What the failed operation offers as its main retry action.
function retryAction(r) {
  if (r.error.kind === "discord-running") return { label: "Close Discord and try again", run: async () => { if (await confirmDialog("Close Discord and try again?")) runOp(r.op, true); } };
  if (r.error.kind === "checkout-modified") return { label: "Repair", run: () => { back(); startOperation("repair"); } };
  return { label: "Try again", run: () => runOp(r.op, false) };
}

function opHeader() {
  const total = ui.steps.length;
  const r = ui.result;
  if (!r) {
    const runningIdx = ui.steps.findIndex(x => x.status === "running");
    const finished = ui.steps.filter(x => x.status === "done" || x.status === "skipped").length;
    const n = runningIdx >= 0 ? runningIdx + 1 : Math.min(finished + 1, total);
    return {
      tone: "run", title: ui.starting || !total ? "Starting…" : `${VERB[ui.op]} · ${n}/${total}`,
      action: { label: "Cancel", disabled: !ui.cancellable, tip: ui.cancellable ? "" : "Cancel is not possible while Discord is being patched.", run: () => send({ type: "cancel" }) },
      running: true,
    };
  }
  if (r.ok) return { tone: "ok", title: SUCCESS[r.op], action: { label: "Done", primary: true, run: back } };
  if (isCancelled()) return { tone: "muted", title: "Cancelled", action: { label: "Done", primary: true, run: back } };
  const failedIdx = ui.steps.findIndex(x => x.status === "failed");
  const retry = retryAction(r);
  return {
    tone: "err", title: failedIdx >= 0 ? `${FAILED[r.op]} at ${failedIdx + 1}/${total}` : FAILED[r.op],
    action: { label: retry.label, primary: true, run: retry.run },
    back: true,
  };
}

function depTitle(d) {
  return d.state === "outdated" ? `${d.name} is too old` : d.state === "error" ? `${d.name} is not working` : `${d.name} is required`;
}

function idleHeader() {
  const v = ui.view;
  const missing = v.dependencies.filter(d => d.state !== "ok");
  const a = v.actions;
  if (v.discord.branches.length === 0) {
    return { tone: "err", title: "Discord was not found", action: { label: "Download Discord", primary: true, run: () => send({ type: "open-url", url: DISCORD_DOWNLOAD_URL }) } };
  }
  if (missing.length) {
    const d = missing[0];
    const inst = ui.deps[d.id];
    const installing = inst && inst.status === "running";
    return {
      tone: "warn", title: depTitle(d), dep: d, depFailed: inst && inst.status === "failed" ? inst.message : null,
      action: d.canAutoInstall
        ? { label: installing ? `Installing ${d.name}…` : `Install ${d.name}`, primary: true, disabled: installing || ui.busy, run: () => send({ type: "install-dependency", id: d.id }) }
        : { label: `Download ${d.name}`, primary: true, run: () => send({ type: "open-url", url: d.downloadUrl }) },
      winget: d.canAutoInstall,
    };
  }
  const tone = v.tone === "error" ? "err" : v.tone === "neutral" ? "muted" : v.tone;
  if (a.repair) return { tone, title: v.headline, action: { label: "Repair", primary: true, disabled: ui.busy, run: () => startOperation("repair") }, note: v.subline };
  if (a.install) return { tone, title: v.headline, action: { label: "Install", primary: true, disabled: ui.busy, run: () => startOperation("install") }, note: v.subline };
  if (a.update) {
    const hasUpdate = !!v.updateText;
    return {
      tone, title: v.headline,
      action: { label: hasUpdate ? (v.solradar.latest ? `Update to ${v.solradar.latest}` : "Update") : v.updateLabel, primary: hasUpdate, disabled: ui.busy, run: () => startOperation("update") },
      note: v.subline,
    };
  }
  return { tone, title: v.headline, action: null, note: v.subline };
}

// ---- strip -----------------------------------------------------------------------------------
const SEG_ICON = { "Git": "git", "Node.js": "node", "Discord": "discord", "Vencord": "vencord", "SolRadar": "solradar" };
function seg(cls, name, value, valueCls) {
  return el("div", { class: `f-seg ${cls}`, title: value ? `${name}: ${value}` : name },
    el("i"), el("span", { class: "nm" }, icon(SEG_ICON[name], 14), el("b", { text: name })), el("span", { class: valueCls || "", text: value || " " }));
}

const TONE_SEG = { ok: "ok", warn: "warn", error: "err", neutral: "muted" };

function idleSegments() {
  const v = ui.view;
  const segs = [];
  for (const id of ["git", "node"]) {
    const d = v.dependencies.find(x => x.id === id);
    if (!d) continue;
    if (d.state === "ok") segs.push(seg("ok", d.name, d.version));
    else if (d.state === "outdated") segs.push(seg("warn", d.name, "too old", "warn"));
    else if (d.state === "error") segs.push(seg("err", d.name, "not working", "err"));
    else segs.push(seg("warn", d.name, "missing", "warn"));
  }
  if (v.discord.branches.length === 0) segs.push(seg("err", "Discord", "not found", "err"));
  else {
    const sel = v.discord.branches.find(b => b.branch === v.discord.selected) || v.discord.branches[0];
    const short = sel.label.replace(/^Discord\s*/, "") || "Stable";
    segs.push(seg("ok", "Discord", v.discord.running ? `${short} · running` : short));
  }
  for (const [name, x] of [["Vencord", v.vencord], ["SolRadar", v.solradar]]) {
    const cls = TONE_SEG[x.tone] === "neutral" ? "muted" : TONE_SEG[x.tone];
    segs.push(seg(cls, name, x.short, cls === "warn" || cls === "err" ? cls : ""));
  }
  return segs;
}

function phasesFor(op, steps) {
  // Map step IDs to phase names
  const stepToPhase = {
    requirements: "Prepare", discord: "Prepare",
    vencord: "Download", solradar: "Download",
    packages: "Build", build: "Build",
    inject: "Patch", verify: "Patch",
    uninject: "Remove",
    launch: "Start",
    repair: "Repair",
  };

  // Override verify for uninstall to be Remove
  const phaseOverrides = {
    uninstall: { verify: "Remove" }
  };

  // Phase order
  const phaseOrder = ["Prepare", "Download", "Build", "Patch", "Remove", "Start", "Repair"];

  // Collect phases and their steps
  const phaseMap = {};
  for (const step of steps) {
    let phase = stepToPhase[step.id];
    if (phaseOverrides[op] && phaseOverrides[op][step.id]) {
      phase = phaseOverrides[op][step.id];
    }
    if (!phase) continue;
    if (!phaseMap[phase]) phaseMap[phase] = [];
    phaseMap[phase].push(step);
  }

  // Build phases in order, only including those that have steps
  const phases = [];
  for (const phaseName of phaseOrder) {
    if (!phaseMap[phaseName]) continue;
    const phaseSteps = phaseMap[phaseName];

    // Determine phase status
    let status = "pending";
    const hasFailure = phaseSteps.some(s => s.status === "failed");
    const hasRunning = phaseSteps.some(s => s.status === "running");
    const allSkipped = phaseSteps.every(s => s.status === "skipped");
    const hasDone = phaseSteps.some(s => s.status === "done");
    const allDoneOrSkipped = phaseSteps.every(s => s.status === "done" || s.status === "skipped");

    if (hasFailure) status = "failed";
    else if (hasRunning) status = "running";
    else if (allSkipped) status = "skipped";
    else if (allDoneOrSkipped && hasDone) status = "done";
    else status = "pending";

    // Determine value text
    const value = status === "running" ? "in progress" : status === "failed" ? "failed" : status === "skipped" ? "skipped" : "";

    phases.push({
      name: phaseName,
      status: status,
      value: value,
    });
  }

  return phases;
}

function opSegments() {
  const cancelled = isCancelled();
  const phases = phasesFor(ui.op, ui.steps);
  return phases.map(p => {
    const status = cancelled && p.status === "running" ? "pending" : p.status;
    const cls = { done: "ok", running: "run", failed: "err", skipped: "skip", pending: "" }[status];
    return seg(cls, p.name, p.value, status === "failed" ? "err" : "");
  });
}

function stripEl() {
  const segs = ui.op ? opSegments() : ui.view ? idleSegments() : [];
  if (!segs.length) return null;
  const strip = el("div", { class: "strip" }, segs);
  strip.style.gridTemplateColumns = `repeat(${segs.length}, minmax(0, 1fr))`;
  return strip;
}

// ---- activity --------------------------------------------------------------------------------
// Step entries become primary lines; commands and their output fold under the latest primary line.
function buildItems() {
  const items = [];
  for (const l of ui.logs) {
    if (!ui.showBackground && l.background) continue;
    const base = { id: l._id, ts: l.ts, lines: [] };
    if (l.kind === "step") {
      const m = /^(▶|✓|✗|–)\s+(.*)$/.exec(l.text);
      if (!m) { items.push({ ...base, type: "step", state: "info", label: l.text, text: l.text }); continue; }
      const mark = m[1];
      if (mark === "▶") { items.push({ ...base, type: "step", state: "run", label: m[2], text: m[2] }); continue; }
      const skip = mark === "–" ? /^(.*?) \(skipped: (.*)\)$/.exec(m[2]) : null;
      const label = skip ? skip[1] : m[2];
      let g = null;
      for (let i = items.length - 1; i >= 0; i--) if (items[i].type === "step" && items[i].state === "run" && items[i].label === label) { g = items[i]; break; }
      if (!g) { g = { ...base, type: "step", label }; items.push(g); }
      g.state = mark === "✓" ? "done" : mark === "✗" ? "failed" : "skipped";
      g.text = mark === "–" ? `${label} — skipped${skip ? `: ${skip[2]}` : ""}` : label;
      continue;
    }
    const last = items[items.length - 1];
    if (l.kind === "cmd") { if (last) last.lines.push({ cls: "c", text: "$ " + l.text }); continue; }
    if (l.kind === "out") { if (last) last.lines.push({ cls: "", text: "│ " + l.text }); continue; }
    if (/^exit -?\d+/.test(l.text) && l.level !== "error") { if (last) last.lines.push({ cls: "", text: "└ " + l.text }); continue; }
    if (l.level === "debug") { if (last) last.lines.push({ cls: "", text: l.text }); continue; }
    items.push({ ...base, type: "msg", level: l.level, text: l.text });
  }
  return items;
}

function reportLink() {
  return el("button", { class: "link", onclick: () => send({ type: "debug-report", redact: ui.redact }), text: "Send debug report" });
}

function friendlyList() {
  const items = buildItems();
  const opRunning = !!ui.op && !ui.result;
  let lastStep = -1;
  items.forEach((it, i) => { if (it.type === "step") lastStep = i; });
  const failedResult = ui.result && !ui.result.ok && !isCancelled() ? ui.result : null;
  let lastError = -1;
  items.forEach((it, i) => { if (it.type === "msg" && it.level === "error") lastError = i; });

  const nodes = [];
  items.forEach((it, i) => {
    let icon = "›", iconCls = "muted", textCls = "", bold = false;
    if (it.type === "step") {
      const active = it.state === "run" && opRunning && i === lastStep;
      if (it.state === "run" && !active) { icon = "–"; iconCls = "muted"; }
      else if (active) { icon = "›"; iconCls = "accent"; bold = true; }
      else if (it.state === "done") { icon = "✓"; iconCls = "ok"; }
      else if (it.state === "failed") { icon = "✕"; iconCls = "err"; textCls = "err"; bold = true; }
      else if (it.state === "skipped") { icon = "–"; iconCls = "muted"; textCls = "muted"; }
      it.active = active;
    } else if (it.level === "warn") { icon = "!"; iconCls = "warn"; }
    else if (it.level === "error") { icon = "✕"; iconCls = "err"; textCls = "err"; bold = true; }

    const text = it.type === "msg" ? it.text.split("\n")[0] : it.text;
    const expanded = it.lines.length > 0 && (ui.showCommands || (ui.groupOpen[it.id] ?? (it.active || it.state === "failed")));
    const toggle = () => { ui.groupOpen[it.id] = !expanded; render(); };
    nodes.push(el("div", { class: "fl-g" },
      el("div", { class: "fl-h" },
        el("span", { class: "t", text: it.ts }),
        el("span", { class: `ic ${iconCls === "accent" ? "" : iconCls}`, style: iconCls === "accent" ? "color:var(--accent)" : null, text: icon }),
        el("span", { class: `x ${textCls} ${bold ? "bold" : ""}`, title: text, text }),
        it.lines.length ? el("button", { class: "n", "aria-expanded": String(expanded), onclick: toggle, text: `${it.lines.length} lines ${expanded ? "▾" : "▸"}` }) : null),
      expanded ? el("div", { class: "fl-cmd" }, it.lines.map(x => el("p", { class: x.cls, text: x.text }))) : null));
    if (it.type === "msg" && it.level === "error" && i === lastError && !failedResult) {
      const rest = it.text.split("\n").slice(1).join("\n").trim();
      nodes.push(el("div", { class: "errbox fl-err" },
        el("b", { text: rest || "Something went wrong." }), " ", rest ? "" : "The debug report helps to find the cause. ", reportLink()));
    }
  });
  if (failedResult) {
    const retry = retryAction(failedResult);
    nodes.push(el("div", { class: "errbox" },
      el("b", { text: failedResult.error.message }), " ",
      el("button", { class: "link", onclick: retry.run, text: retry.label }), " · ", reportLink()));
  }
  return nodes.length ? nodes : [el("div", { class: "empty", text: "Nothing to show yet." })];
}

// One persistent scroll box so the scroll position survives the full re-render on every event.
const logBox = el("div", { class: "fl", onscroll: () => {
  ui.logStick = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 8;
  ui.logTop = logBox.scrollTop;

function sw(label, on, fn) {

}

function activitySection() {

  return [
    el("div", { class: "tools" }, el("span", { text: "Activity" }),
      el("div", { class: "sws" },
        sw("Show commands", ui.showCommands, () => { ui.showCommands = !ui.showCommands; render(); }),

function syncLogScroll() {

// ---- menu ------------------------------------------------------------------------------------
const SIMS = [
  ["solradar-update", "SolRadar update available"], ["vencord-update", "Vencord update available"],

function closeMenu() { ui.menu = false; ui.menuSub = null; }

// Menu item. `keep` leaves the menu open after the click (toggles).
function mi(id, label, o) {

function submenu(key, label, items) {

    el("button", { class: "mi", role: "menuitem", "aria-haspopup": "menu", "aria-expanded": String(open), "data-id": key,
      onclick: () => { ui.menuSub = open ? null : key; render(); } }, el("span", { class: "mt", text: label }), el("span", { class: "r", text: "›" })),

function menuEl() {

document.addEventListener("click", ev => {
  if (!ui.menu) return;
  const t = ev.target;
  if (t instanceof Element && t.closest(".menu, .menubtn")) return;
  closeMenu(); render();
});
document.addEventListener("keydown", ev => {
  if (!ui.menu) return;
  const active = document.activeElement;
  const menu = active && active.closest ? active.closest(".menu") : null;
  if (ev.key === "Escape") {
    ev.preventDefault();
    if (ui.menuSub) { ui.focusId = ui.menuSub; ui.menuSub = null; }
    else { closeMenu(); ui.focusId = "menubtn"; }
    render();
  } else if ((ev.key === "ArrowDown" || ev.key === "ArrowUp") && menu) {
    ev.preventDefault();
    const list = [...menu.querySelectorAll(":scope > .mi:not(:disabled), :scope > .has-sub > .mi:not(:disabled)")];
    const i = list.indexOf(active);
    const next = list[(i + (ev.key === "ArrowDown" ? 1 : -1) + list.length) % list.length];
    if (next) next.focus();
  } else if (ev.key === "ArrowRight" && active && active.parentElement && active.parentElement.classList.contains("has-sub")) {
    ev.preventDefault();
    ui.menuSub = active.dataset.id;
    ui.focusId = "first-sub";
    render();
  } else if (ev.key === "ArrowLeft" && menu && menu.classList.contains("sub")) {
    ev.preventDefault();
    ui.focusId = ui.menuSub; ui.menuSub = null;
    render();
  }
});

function applyFocus() {
  const id = ui.focusId;
  ui.focusId = null;
  if (!id) return;
  let node = null;
  if (id === "first-sub") node = document.querySelector(".has-sub.open > .sub .mi:not(:disabled)");
  else node = [...document.querySelectorAll("[data-id]")].find(n => n.dataset.id === id);
  if (node) node.focus();
}

// ---- screen ----------------------------------------------------------------------------------
function selfSteps(d) {
  return el("div", { class: "selfsteps small muted" },
    el("div", { class: "row" }, icon(SEG_ICON[d.name], 14), el("span", {}, "Prefer to install it yourself? "),
      el("button", { class: "link", onclick: () => { ui.showManual = !ui.showManual; render(); }, text: ui.showManual ? "Hide steps" : "Show steps" })),
    ui.showManual ? el("ol", {}, d.manualSteps.map(s => el("li", { text: s }))) : null,
    ui.showManual ? el("div", { class: "acts" },
      el("button", { onclick: () => send({ type: "open-url", url: d.downloadUrl }), text: "Open download page" }),
      el("button", { disabled: ui.busy, onclick: () => send({ type: "refresh" }), text: "Check again" })) : null);
}

function headerEl(h) {
  const btn = a => a ? el("button", { class: a.primary ? "primary" : "", disabled: a.disabled, title: a.tip, onclick: a.run, text: a.label }) : null;
  return el("div", { class: "headwrap" },
    el("div", { class: "row" },
      el("span", { class: `dot ${h.tone === "run" ? "run" : h.tone === "muted" ? "muted" : h.tone}` }),
      icon("solradar", 16),
      el("b", { class: `title grow ${h.tone === "err" ? "err" : ""}`, text: h.title }),
      ui.view && ui.view.simulations.length ? el("span", { class: "badge", text: "Test scenario active" }) : null,
      btn(h.action),
      h.back ? el("button", { class: "ghost", onclick: back, text: "Back" }) : null,
      el("button", { class: "ghost menubtn", "data-id": "menubtn", "aria-label": "More", "aria-haspopup": "menu", "aria-expanded": String(ui.menu),
        onclick: ev => { ui.menu = !ui.menu; ui.menuSub = null; if (ui.menu && ev.detail === 0) ui.focusId = "check"; render(); }, text: "⋯" })),
    ui.menu ? menuEl() : null);
}

function render() {
  const app = document.getElementById("app");
  const parts = [];
  if (ui.fatal) parts.push(el("div", { class: "fatal" }, el("span", { class: "grow", text: ui.fatal }),
    el("button", { onclick: () => { ui.fatal = null; send({ type: "open-logs" }); render(); }, text: "Open logs" })));
  const v = ui.view;
  if (!v && !ui.op) {
    parts.push(headerEl({ tone: "run", title: "Checking your computer…", action: null }), el("div", { class: "bar" }));
  } else {
    if (v && v.helperUpdate && !ui.op) parts.push(el("div", { class: "notice" },
      el("span", { class: "grow", text: `A new version of SolRadar Helper is available (${v.helperUpdate.latest}).` }),
      el("button", { class: "link", onclick: () => send({ type: "open-url", url: v.helperUpdate.url }), text: "Download" })));
    const h = ui.op ? opHeader() : idleHeader();
    parts.push(headerEl(h));
    if (h.running) parts.push(el("div", { class: "bar" }));
    const strip = stripEl();
    if (strip) parts.push(strip);
    if (h.depFailed) parts.push(el("div", { class: "small err", text: h.depFailed }));
    if (h.winget) parts.push(el("div", { class: "small muted", text: "Windows may ask for permission to make changes. That request is for this installation — click Yes." }));
    if (h.note) parts.push(el("div", { class: "small muted", text: h.note }));
    if (h.dep) parts.push(selfSteps(h.dep));
    if (ui.op && ui.result && ui.result.ok && ui.result.op === "uninstall") parts.push(el("div", { class: "row small muted" },
      el("span", { text: "Want regular Vencord back? Use the official Vencord Installer." }),
      el("button", { class: "link", onclick: () => send({ type: "open-url", url: VENCORD_INSTALLER_URL }), text: "Open Vencord Installer page" })));
  }
  parts.push(...activitySection());
  parts.push(el("footer", { text: "Unofficial tool — not affiliated with Vencord or Discord." }));
  app.replaceChildren(...parts);
  syncLogScroll();
  applyFocus();
}

async function poll() {
  try {
    const events = await window.__poll();
    if (events.length) { for (const e of events) handle(e); render(); }
  } finally {
    setTimeout(poll, 100);
  }
}

render();
poll();
</script>
</body>
</html>
