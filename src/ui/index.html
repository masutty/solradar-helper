<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SolRadar Helper</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6675; --line: #e3e6eb;
    --ok: #1f8a4c; --warn: #b26a00; --error: #c62828; --neutral: #4b5563; --accent: #4f46e5; --accent-text: #fff;
    --log-cmd: #0e6c8f; --log-step: #4f46e5; --log-warn: #a35f00; --log-error: #c62828; --log-error-bg: #fdeaea; --log-time: #8a93a3;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --card: #1f232b; --text: #e7e9ee; --muted: #9aa3b2; --line: #2e333d;
            --ok: #4ade80; --warn: #fbbf24; --error: #f87171; --neutral: #9aa3b2; --accent: #818cf8; --accent-text: #111;
            --log-cmd: #5cc8ee; --log-step: #a5b4fc; --log-warn: #fbbf24; --log-error: #ff8080; --log-error-bg: #3a1d20; --log-time: #6f7787; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 720px; margin: 0 auto; padding: 20px 20px 12px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .label { color: var(--muted); }
  .tone-ok { color: var(--ok); } .tone-warn { color: var(--warn); } .tone-error { color: var(--error); } .tone-neutral { color: var(--neutral); }
  .banner { border-left: 4px solid var(--accent); }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  button.danger { color: var(--error); }
  button:disabled { opacity: .45; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  .dep h3 { margin: 0 0 4px; font-size: 15px; }
  .dep p { margin: 4px 0; }
  .dep ol { margin: 8px 0; padding-left: 20px; }
  .note { font-size: 12px; color: var(--muted); }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { padding: 6px 0; display: flex; gap: 10px; }
  .steps .icon { width: 18px; text-align: center; }
  .steps .running { font-weight: 600; }
  .steps .detail { color: var(--muted); font-size: 12px; }
  .st-running { color: var(--accent); } .st-done { color: var(--ok); } .st-failed { color: var(--error); }
  .st-skipped { color: var(--log-time); } .st-pending { color: var(--muted); }
  .current { font-size: 16px; font-weight: 600; margin: 4px 0 0; }
  .linkbtn { background: none; border: none; padding: 4px 0; color: var(--muted); text-decoration: underline; font-size: 12px; margin: 6px 0; }
  .adv { margin-top: 4px; }
  .adv .tool { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 0; }
  .adv .tool + .tool { border-top: 1px solid var(--line); }
  .adv .tool .note { margin: 0; }
  .adv .sims { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .adv .sims button.on { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 1px 10px; margin-bottom: 8px; }
  .output { font: 12px Consolas, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 8px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 12px 0; }
  .bar::after { content: ""; display: block; width: 30%; height: 100%; background: var(--accent); animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  footer { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; }
  footer .disclaimer { width: 100%; font-size: 12px; color: var(--muted); margin-top: 6px; }
  select { font: inherit; padding: 4px 8px; border-radius: 6px; background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .overlay .dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); max-width: 460px; width: 100%; padding: 16px 18px; }
  .overlay .dialog p { margin: 0 0 8px; white-space: pre-wrap; }
  .activity { margin-top: 12px; width: 100%; }
  .activity h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  .activity .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
  .activity .head h2 { margin: 0; }
  .activity .head label { font-size: 12px; color: var(--muted); }
  .activity .log { margin: 0; font: 11px/1.45 Consolas, monospace; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; max-height: 220px; overflow: auto; }
  .log .ln { padding: 0 10px; white-space: pre-wrap; word-break: break-word; border-left: 3px solid transparent; }
  .log .ts { color: var(--log-time); margin-right: 8px; }
  .log .ln.cmd { color: var(--log-cmd); }
  .log .ln.out { color: var(--muted); }
  .log .ln.step { color: var(--log-step); font-weight: 700; }
  .log .ln.warn { color: var(--log-warn); }
  .log .ln.error { color: var(--log-error); font-weight: 700; background: var(--log-error-bg); border-left-color: var(--log-error); padding-top: 2px; padding-bottom: 2px; margin: 2px 0; }
  .log .empty { padding: 0 10px; color: var(--muted); }
  .errbanner { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; background: var(--log-error-bg); color: var(--log-error); border: 1px solid var(--log-error); border-left-width: 4px; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-weight: 700; white-space: pre-wrap; word-break: break-word; }
  .errbanner button { padding: 2px 8px; font-size: 12px; flex: none; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; }
</style>
</head>
<body>
<main id="app">Loading…</main>
<script>
"use strict";
// Forward UI errors to the backend log, so problems inside the window are never silent.
// Loop-proof: binding-parse errors are ignored, errors raised while forwarding are never forwarded,
// and at most 5 errors per 10 s are forwarded.
let forwarding = false;
const forwardTimes = [];
function reportError(err) {
  const message = err && err.message ? String(err.message) : String(err);
  const stack = err && err.stack ? String(err.stack) : undefined;
  if (message.includes("Failed to parse binding result as JSON")) return;
  if (forwarding) return;
  const now = Date.now();
  while (forwardTimes.length && now - forwardTimes[0] > 10000) forwardTimes.shift();
  if (forwardTimes.length >= 5) return;
  forwardTimes.push(now);
  forwarding = true;
  try {
    const p = window.__send({ type: "ui-error", message, stack });
    if (p && typeof p.catch === "function") p.catch(() => {});
  } catch (_) { /* nothing else we can do */ }
  finally { forwarding = false; }
  try {
    ui.fatal = "Something went wrong in the window. Open the logs for details.";
    render();
  } catch (_) { /* rendering itself is broken */ }
}
window.onerror = (message, source, line, col, error) => {
  reportError(error || new Error(`${message} (${source}:${line}:${col})`));
};
window.addEventListener("unhandledrejection", ev => reportError(ev.reason));

const VENCORD_INSTALLER_URL = "https://vencord.dev/download/";
const DISCORD_DOWNLOAD_URL = "https://discord.com/download";
const HELP_URL = "https://github.com/masutty/solradar-helper#readme";

const ui = { view: null, busy: false, op: null, steps: [], cancellable: true, lastLine: "", result: null, deps: {}, showManual: {}, redact: true, fatal: null,
  starting: false, showSteps: null, showAdvanced: false, showSims: false, logs: [], logDirty: true, showActivity: false, logStick: true, logTop: 0, showBackground: false, logError: null };
const send = cmd => {
  const p = window.__send(cmd);
  if (p && typeof p.catch === "function") p.catch(() => {});
  return p;
};

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) node.addEventListener(k.slice(2), ev => {
      try {
        const r = v(ev);
        if (r && typeof r.then === "function") r.then(undefined, reportError);
      } catch (err) { reportError(err); }
    });
    else if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}

function confirmDialog(text) {
  return new Promise(resolve => {
    const done = answer => { overlay.remove(); resolve(answer); };
    const overlay = el("div", { class: "overlay" },
      el("div", { class: "dialog", role: "dialog" },
        el("p", { text }),
        el("div", { class: "actions", style: "justify-content:flex-end;margin-bottom:0" },
          el("button", { onclick: () => done(false), text: "Cancel" }),
          el("button", { class: "primary", onclick: () => done(true), text: "Continue" }))));
    document.body.append(overlay);
  });
}

// Show the progress screen right away; the backend's "steps" event replaces this placeholder.
function runOp(op, closeDiscord) {
  ui.result = null; ui.op = op; ui.steps = []; ui.lastLine = ""; ui.cancellable = true; ui.starting = true; ui.showSteps = null;
  render();
  send({ type: "run", op, closeDiscord });
}

function toast(text) {
  const t = el("div", { class: "toast", text });
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

async function startOperation(op) {
  const v = ui.view;
  const needsClose = v.discord.running && (op === "install" || op === "uninstall" || op === "inject" || (op === "update" && !v.discord.injected));
  const lines = [];
  if (op === "update" && v.updateLabel === "Reinstall") lines.push("Your system already looks up to date. Do you want to reinstall anyway?");
  if (op === "uninstall") lines.push("This removes Vencord from Discord completely — not only SolRadar. If you want regular Vencord back afterwards, use the official Vencord Installer.");
  if (op === "repair") lines.push("The Helper's copy of Vencord or SolRadar has unexpected changes. Repair discards those changes and restores the original files.");
  if (needsClose) lines.push("Discord needs to be closed and will be closed now.");
  if (op === "update" && v.discord.running && !needsClose) lines.push("Discord will restart when the update is done.");
  if (op === "inject" && !needsClose) lines.push("SolRadar will be applied to Discord again.");
  if (lines.length && !(await confirmDialog(lines.join("\n\n")))) return;
  runOp(op, needsClose);
}

function handle(e) {
  switch (e.type) {
    case "view": ui.view = e.view; ui.busy = e.busy; break;
    case "steps": ui.op = e.op; ui.steps = e.steps; ui.result = null; ui.starting = false; ui.lastLine = ""; ui.cancellable = true; ui.showSteps = null; break;
    case "step": {
      const s = ui.steps.find(x => x.id === e.id);
      if (s) { s.status = e.status; s.detail = e.detail; }
      ui.cancellable = e.cancellable; ui.lastLine = "";
      break;
    }
    case "output": ui.lastLine = e.line; break;
    case "operation-end": ui.result = e; ui.op = e.op; ui.starting = false; break;
    case "log":
      ui.logs.push(e.entry);
      if (ui.logs.length > 500) ui.logs.splice(0, ui.logs.length - 500);
      ui.logDirty = true;
      if (e.entry.level === "error") {
        ui.logError = e.entry.text.split("\n")[0];
        ui.showActivity = true;
        ui.logStick = true;
      }
      break;
    case "dependency-install":
      ui.deps[e.id] = e;
      if (e.status === "done") toast("Installed successfully.");
      break;
    case "show-activity": ui.showActivity = true; ui.logStick = true; ui.logDirty = true; break;
    case "report-ready": toast("Debug report saved. Explorer will show the file."); break;
    case "fatal": ui.fatal = e.message; break;
  }
}

const ICON = { pending: "○", running: "→", done: "✓", failed: "✗", skipped: "–" };

// Skipped steps count as finished.
function stepSummary() {
  const total = ui.steps.length;
  const finished = ui.steps.filter(x => x.status === "done" || x.status === "skipped").length;
  const cancelled = ui.result && !ui.result.ok && ui.result.error.kind === "cancelled";
  const failedIdx = cancelled ? -1 : ui.steps.findIndex(x => x.status === "failed");
  const runningIdx = ui.steps.findIndex(x => x.status === "running");
  if (failedIdx >= 0) return { status: "failed", text: `Step ${failedIdx + 1}/${total} failed · ${ui.steps[failedIdx].label}`, failed: true };
  if (ui.result) return { status: ui.result.ok ? "done" : "pending", text: `${finished}/${total} steps`, failed: false };
  if (runningIdx >= 0) return { status: "running", text: `Step ${runningIdx + 1}/${total} · ${ui.steps[runningIdx].label}`, failed: false };
  return { status: "pending", text: `${finished}/${total} steps`, failed: false };
}
const SUCCESS = {
  install: "SolRadar installed successfully",
  update: "SolRadar updated successfully",
  uninstall: "Vencord was removed from Discord",
  repair: "Repair complete",
  build: "SolRadar rebuilt successfully",
  inject: "SolRadar re-applied to Discord",
};
const RUNNING = { install: "Installing SolRadar…", update: "Updating SolRadar…", uninstall: "Removing Vencord…", repair: "Repairing…", build: "Rebuilding SolRadar…", inject: "Re-applying to Discord…" };

function progressScreen() {
  const r = ui.result;
  const title = r ? (r.ok ? SUCCESS[r.op] : "Something went wrong") : ui.starting ? "Starting…" : RUNNING[ui.op];
  const children = [
    el("h1", { class: r ? (r.ok ? "tone-ok" : "tone-error") : "", text: title }),
  ];
  if (ui.steps.length) {
    const sum = stepSummary();
    const expanded = ui.showSteps ?? sum.failed;
    children.push(el("div", { class: `current st-${sum.status}`, text: sum.text }));
    children.push(el("button", { class: "linkbtn", onclick: () => { ui.showSteps = !expanded; render(); }, text: expanded ? "Hide all steps" : "Show all steps" }));
    if (expanded) children.push(el("ul", { class: "steps" }, ui.steps.map(s => el("li", { class: `${s.status} st-${s.status}` },
      el("span", { class: "icon", text: ICON[s.status] }),
      el("div", {}, el("div", { text: s.label }), s.detail ? el("div", { class: "detail", text: s.detail }) : null)))));
  }
  children.push(activityPanel());
  if (!r) {
    children.push(el("div", { class: "bar" }));
    if (ui.lastLine) children.push(el("div", { class: "output", text: ui.lastLine }));
    children.push(el("div", { class: "actions" },
      el("button", { disabled: !ui.cancellable, onclick: () => send({ type: "cancel" }), text: ui.cancellable ? "Cancel" : "Cancel (not possible while Discord is being patched)" })));
  } else if (r.ok) {
    if (r.op === "uninstall") children.push(el("p", { class: "sub", text: "Want regular Vencord back? Use the official Vencord Installer." }));
    children.push(el("div", { class: "actions" },
      el("button", { class: "primary", onclick: back, text: "Done" }),
      r.op === "uninstall" ? el("button", { onclick: () => send({ type: "open-url", url: VENCORD_INSTALLER_URL }), text: "Open Vencord Installer page" }) : null));
  } else {
    children.push(el("p", { text: r.error.message }));
    children.push(el("div", { class: "actions" },
      r.error.kind === "discord-running"
        ? el("button", { class: "primary", onclick: async () => { if (await confirmDialog("Close Discord and try again?")) runOp(r.op, true); }, text: "Close Discord and try again" })
        : r.error.kind === "checkout-modified"
          ? el("button", { class: "primary", onclick: () => { back(); startOperation("repair"); }, text: "Repair" })
          : r.error.kind === "cancelled" ? null
          : el("button", { class: "primary", onclick: () => runOp(r.op, false), text: "Try again" }),
      el("button", { onclick: () => send({ type: "open-logs" }), text: "Open logs" }),
      el("button", { onclick: back, text: "Back" })));
  }
  return children;
}

function back() {
  ui.op = null; ui.result = null; ui.steps = []; ui.starting = false;
  send({ type: "refresh" });
  render();
}

// One persistent log box so scroll position survives the full re-render on every poll.
const logPre = el("div", { class: "log", onscroll: () => {
  ui.logStick = logPre.scrollHeight - logPre.scrollTop - logPre.clientHeight < 8;
  ui.logTop = logPre.scrollTop;
} });

function logLine(entry) {
  // The timestamp column stays aligned; only the text is marked as belonging to the command above.
  const prefix = entry.kind === "cmd" ? "$ "
    : entry.kind === "out" ? "  │ "
    : entry.level !== "error" && /^exit -?\d+$/.test(entry.text) ? "  └ "
    : entry.level === "error" ? "ERROR " : "";
  return el("div", { class: `ln ${entry.kind} ${entry.level}` }, el("span", { class: "ts", text: entry.ts }), prefix + entry.text);
}

function activityPanel() {
  if (ui.logDirty) {
    const shown = ui.logs.filter(l => ui.showBackground || !l.background);
    logPre.replaceChildren(...(shown.length ? shown.map(logLine) : [el("div", { class: "empty", text: "Nothing to show yet." })]));
    ui.logDirty = false;
  }
  const box = el("input", { type: "checkbox", onchange: e => { ui.showBackground = e.target.checked; ui.logDirty = true; render(); } });
  box.checked = ui.showBackground;
  return el("div", { class: "activity" },
    ui.logError ? el("div", { class: "errbanner" }, el("span", { text: "Error: " + ui.logError }),
      el("button", { onclick: () => { ui.logError = null; render(); }, text: "Dismiss" })) : null,
    el("div", { class: "head" }, el("h2", { text: "Activity" }), el("label", {}, box, " Show background checks")),
    logPre);
}

function syncLogScroll() {
  if (!logPre.isConnected) return;
  logPre.scrollTop = ui.logStick ? logPre.scrollHeight : ui.logTop;
}

function dependencyCard(d) {
  if (d.state === "ok") return el("div", { class: "row" }, el("span", { text: d.name }), el("span", { class: "tone-ok", text: `✓ ${d.version}` }));
  const inst = ui.deps[d.id];
  const installing = inst && inst.status === "running";
  const title = d.state === "outdated" ? `${d.name} is too old` : d.state === "error" ? `${d.name} is not working` : `${d.name} is not installed`;
  return el("div", { class: "card dep" },
    el("h3", { class: "tone-warn", text: title }),
    el("p", { text: d.why }),
    d.detail ? el("p", { class: "note", text: d.detail }) : null,
    inst && inst.status === "failed" ? el("p", { class: "tone-error", text: inst.message }) : null,
    el("div", { class: "actions" },
      d.canAutoInstall ? el("button", { class: "primary", disabled: installing || ui.busy, onclick: () => send({ type: "install-dependency", id: d.id }), text: installing ? `Installing ${d.name}…` : "Install automatically" }) : null,
      el("button", { onclick: () => { ui.showManual[d.id] = !ui.showManual[d.id]; render(); }, text: ui.showManual[d.id] ? "Hide manual steps" : "Install it myself" }),
      el("button", { disabled: installing, onclick: () => send({ type: "refresh" }), text: "Check again" })),
    d.canAutoInstall ? el("p", { class: "note", text: "Windows may ask for permission to make changes. That request is for this installation — click Yes." }) : null,
    ui.showManual[d.id] ? el("div", {},
      el("ol", {}, d.manualSteps.map(s => el("li", { text: s }))),
      el("button", { onclick: () => send({ type: "open-url", url: d.downloadUrl }), text: "Open download page" })) : null);
}

const SIMS = [
  ["solradar-update", "SolRadar update available"], ["vencord-update", "Vencord update available"],
  ["helper-update", "New Helper version available"], ["update-failed", "Update check failed"],
  ["git-missing", "Git missing"], ["node-missing", "Node.js missing"], ["node-old", "Node.js too old"],
  ["discord-missing", "Discord not found"], ["discord-running", "Discord running"],
];

function tool(label, desc, disabled, onclick) {
  return el("div", { class: "tool" }, el("button", { disabled, onclick, text: label }), el("p", { class: "note", text: desc }));
}

function advancedSection(v) {
  const adv = v.advanced;
  const parts = [el("button", { class: "linkbtn", onclick: () => { ui.showAdvanced = !ui.showAdvanced; render(); }, text: ui.showAdvanced ? "Hide troubleshooting tools" : "Troubleshooting tools" })];
  if (!ui.showAdvanced) return el("div", { class: "adv" }, parts);
  parts.push(el("p", { class: "note", text: "You normally don't need these. Use them if something looks wrong or if support asks you to." }));
  parts.push(tool("Rebuild SolRadar", "Rebuilds using the files already downloaded. Your Discord keeps working if it fails.", ui.busy || !adv.build, () => startOperation("build")));
  parts.push(tool("Re-apply to Discord", "Applies SolRadar to Discord again, for example after a Discord update.", ui.busy || !adv.inject, () => startOperation("inject")));
  parts.push(tool("Show versions", "Lists the installed and latest versions in the activity log.", ui.busy, () => send({ type: "show-versions" })));
  parts.push(tool("Open installation folder", "Opens the folder where SolRadar Helper keeps its files.", false, () => send({ type: "open-root" })));
  parts.push(el("button", { class: "linkbtn", onclick: () => { ui.showSims = !ui.showSims; render(); }, text: ui.showSims ? "Hide test scenarios" : "Test scenarios" }));
  if (ui.showSims) {
    parts.push(el("p", { class: "note", text: "These only change what this window shows, to test how it reacts. Nothing on your computer is changed. Restarting the Helper clears them." }));
    parts.push(el("div", { class: "sims" },
      SIMS.map(([id, label]) => { const on = v.simulations.includes(id);
        return el("button", { class: on ? "on" : "", onclick: () => send({ type: "simulate", id, on: !on }), text: `${label}: ${on ? "on" : "off"}` }); }),
      el("button", { onclick: () => send({ type: "simulate-error" }), text: "Show an error in the activity" }),
      el("button", { disabled: !v.simulations.length, onclick: () => send({ type: "simulate-clear" }), text: "Clear all" })));
  }
  return el("div", { class: "adv" }, parts);
}

function mainScreen() {
  const v = ui.view;
  const deps = v.dependencies;
  const children = [];
  if (v.helperUpdate) children.push(el("div", { class: "card banner row" },
    el("span", { text: `A new version of SolRadar Helper is available (${v.helperUpdate.latest}).` }),
    el("button", { onclick: () => send({ type: "open-url", url: v.helperUpdate.url }), text: "Download" })));
  if (v.simulations.length) children.push(el("div", { class: "badge", text: "Test scenario active" }));
  children.push(el("h1", { class: `tone-${v.tone}`, text: v.headline }));
  children.push(el("p", { class: "sub", text: v.subline || v.updateText || "" }));
  if (v.subline && v.updateText) children.push(el("p", { class: "sub", text: v.updateText }));

  children.push(el("div", { class: "card" },
    el("div", { class: "row" }, el("span", { class: "label", text: "Discord" }),
      v.discord.branches.length > 1
        ? el("select", { disabled: ui.busy, onchange: e => send({ type: "select-branch", branch: e.target.value }) },
            v.discord.branches.map(b => { const o = el("option", { value: b.branch, text: b.label }); o.selected = b.branch === v.discord.selected; return o; }))
        : null,
      el("span", { class: `tone-${v.discord.tone}`, text: v.discord.label })),
    el("div", { class: "row" }, el("span", { class: "label", text: "SolRadar" }), el("span", { class: `tone-${v.solradar.tone}`, text: v.solradar.label })),
    el("div", { class: "row" }, el("span", { class: "label", text: "Vencord" }), el("span", { class: `tone-${v.vencord.tone}`, text: v.vencord.label })),
    el("div", { class: "row" }, el("span", { class: "label", text: "Requirements" }),
      el("span", { class: deps.every(d => d.state === "ok") ? "tone-ok" : "tone-warn", text: deps.every(d => d.state === "ok") ? "All installed" : "Missing" }))));

  if (v.discord.branches.length === 0) children.push(el("div", { class: "actions" },
    el("button", { class: "primary", onclick: () => send({ type: "open-url", url: DISCORD_DOWNLOAD_URL }), text: "Download Discord" }),
    el("button", { onclick: () => send({ type: "refresh" }), text: "Check again" })));

  const missing = deps.filter(d => d.state !== "ok");
  if (missing.length) children.push(el("div", {}, el("h1", { style: "font-size:16px", text: "Requirements" }), deps.map(dependencyCard)));

  const a = v.actions;
  children.push(el("div", { class: "actions" },
    a.repair ? el("button", { class: "primary", disabled: ui.busy, onclick: () => startOperation("repair"), text: "Repair" }) : null,
    a.install ? el("button", { class: "primary", disabled: ui.busy, onclick: () => startOperation("install"), text: "Install" }) : null,
    a.update ? el("button", { class: v.updateText ? "primary" : "", disabled: ui.busy, onclick: () => startOperation("update"), text: v.updateLabel }) : null,
    a.uninstall ? el("button", { class: "danger", disabled: ui.busy, onclick: () => startOperation("uninstall"), text: "Uninstall" }) : null,
    el("button", { disabled: ui.busy, onclick: () => send({ type: "refresh" }), text: "Check again" })));
  children.push(advancedSection(v));
  return children;
}

function footer() {
  const box = el("input", { type: "checkbox", id: "redact", onchange: e => { ui.redact = e.target.checked; } });
  box.checked = ui.redact;
  return el("footer", {},
    el("button", { onclick: () => send({ type: "open-logs" }), text: "Open logs" }),
    el("button", { onclick: () => send({ type: "debug-report", redact: ui.redact }), text: "Generate a debug report" }),
    el("label", {}, box, " Hide personal information"),
    el("button", { onclick: () => send({ type: "open-url", url: HELP_URL }), text: "Help" }),
    ui.op ? null : el("button", { onclick: () => { ui.showActivity = !ui.showActivity; render(); }, text: ui.showActivity ? "Hide activity" : "Show activity" }),
    !ui.op && ui.showActivity ? activityPanel() : null,
    el("div", { class: "disclaimer", text: "Unofficial tool — not affiliated with Vencord or Discord." }));
}

function render() {
  const app = document.getElementById("app");
  const parts = [];
  if (ui.fatal) parts.push(el("div", { class: "card tone-error" }, el("span", { text: ui.fatal + " " }),
    el("button", { onclick: () => { ui.fatal = null; send({ type: "open-logs" }); render(); }, text: "Open logs" })));
  if (!ui.view && !ui.op) parts.push(el("h1", { text: "Checking your computer…" }), el("div", { class: "bar" }));
  else if (ui.op) parts.push(...progressScreen());
  else parts.push(...mainScreen());
  parts.push(footer());
  app.replaceChildren(...parts);
  syncLogScroll();
}

async function poll() {
  try {
    const events = await window.__poll();
    if (events.length) { for (const e of events) handle(e); render(); }
  } finally {
    setTimeout(poll, 100);
  }
}

render();
poll();
</script>
</body>
</html>
